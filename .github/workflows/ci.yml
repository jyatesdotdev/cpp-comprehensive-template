name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  VCPKG_ROOT: ${{ github.workspace }}/.vcpkg

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y curl zip unzip tar pkg-config ninja-build

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja pkg-config

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          if [ -x "$VCPKG_ROOT/bootstrap-vcpkg.sh" ]; then
            "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          else
            "$VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          fi

      - name: Configure
        run: cmake --preset ci

      - name: Build
        run: cmake --build --preset ci

      - name: Test
        run: ctest --preset ci

  coverage:
    name: Coverage (≥80%)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install lcov and bc
        run: sudo apt-get update && sudo apt-get install -y lcov bc curl zip unzip tar pkg-config ninja-build

      - name: Bootstrap vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Build with coverage
        run: |
          cmake --preset coverage
          cmake --build --preset coverage

      - name: Run tests with coverage
        run: ctest --preset coverage

      - name: Generate coverage report
        run: |
          lcov --capture --directory build/coverage --output-file coverage.info --ignore-errors mismatch,empty
          lcov --remove coverage.info '/usr/*' '*/tests/*' '*/third_party/*' '*/vcpkg_installed/*' '*/_deps/*' --output-file coverage.info --ignore-errors empty,unused
          lcov --list coverage.info --ignore-errors empty || true

      - name: Check coverage threshold
        run: |
          COVERAGE=$(lcov --summary coverage.info 2>&1 | grep "lines" | grep -oP '[\d.]+%' | head -1 | tr -d '%')
          echo "Line coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 80.0" | bc -l) )); then
            echo "::error::Coverage ${COVERAGE}% is below 80% threshold"
            exit 1
          fi
